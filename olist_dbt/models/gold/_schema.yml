version: 2
models:
  - name: dim_customer
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: dim_seller
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
  - name: dim_product
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: fact_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: purchase_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fact_order_items
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_id