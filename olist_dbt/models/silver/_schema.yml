version: 2
models:
  - name: silver_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: silver_products
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: silver_sellers
    columns:
      - name: seller_id
        tests: [unique, not_null]


  - name: silver_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable',
                         'invoiced', 'processing', 'created', 'approved']

  - name: silver_order_reviews
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: review_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: silver_order_payments
    columns:
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card']